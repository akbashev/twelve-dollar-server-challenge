# Not for upstream: #371 as it is (-next: like counts off the leaf pages, writing BtCursor.ix to step a page at a time)
# against it with both dropped (-drop: one sqlite3BtreeNext and one record read per entry), on x86 runners, each on one
# CPU in its own cgroup under the same mload load; and -drop through the tests and against SQL's answers.
name: x86 profile
on:
  push:
    branches: [x86-profile-2]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 jq curl openssl
      - name: seed
        run: bash seed/make-seed.sh
      - name: install
        run: sudo bash submissions/swift-iouring-akbashev/install.sh > /tmp/install.log 2>&1 || { tail -20 /tmp/install.log; exit 1; }
      - name: tests
        run: |
          set -o pipefail
          bash test/run.sh submissions/swift-iouring-akbashev-drop 2>&1 | tail -15
      - name: B-tree reads against SQL
        run: |
          set -o pipefail
          SUB=swift-iouring-akbashev-drop bash profile/equivalence.sh | tee /tmp/equivalence.txt
          grep -q 'different: 0' /tmp/equivalence.txt

  profile:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.1', cache: false }
      - name: machine
        run: lscpu | grep -E 'Model name|^CPU\(s\)|Thread|MHz|Flags' | cut -c1-300; uname -r; free -m
      - name: tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3 jq curl openssl linux-tools-common "linux-tools-$(uname -r)" \
            || sudo apt-get install -y -qq linux-tools-generic
      - name: seed
        run: bash seed/make-seed.sh
      - name: install
        run: sudo bash submissions/swift-iouring-akbashev/install.sh > /tmp/install-swift.log 2>&1 || { tail -20 /tmp/install-swift.log; exit 1; }
      - name: build
        run: |
          bash submissions/swift-iouring-akbashev-next/build.sh 2>&1 | tail -2
          bash submissions/swift-iouring-akbashev-drop/build.sh 2>&1 | tail -2
          (cd profile/mload && go build -o mload .)
      - name: rate (40,000 users, short thinks)
        env: { LABEL: rate, USERS: '40000', TARGETS: '127.0.0.1,127.0.0.2', THINK: '0.15', RAMP: '20', HOLD: '80', WINDOW: '20', PERF: '15' }
        run: |
          # Which goes first alternates between runs, so neither always gets the machine first.
          if [ $((${{ matrix.run }} % 2)) = 1 ]; then
            bash profile/run.sh swift-iouring-akbashev-next swift-iouring-akbashev-drop
          else
            bash profile/run.sh swift-iouring-akbashev-drop swift-iouring-akbashev-next
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'profile-rate-${{ matrix.run }}', path: profile/out, retention-days: 7 }

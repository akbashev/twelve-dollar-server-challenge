# Not for upstream: main (#376) against mojo-iouring-oh-meh and rust-iouring-kensac with the server's cgroup memory
# capped (memory.max) at three levels, for what memory pressure (the box's 2 GB near its user count) costs each: CPU per
# request, p99, major faults, reclaim scans and refaults, OOM kills. Two jobs per level, rotating order.
name: x86 profile
on:
  push:
    branches: [x86-profile-2]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        mem: [none, 200M, 160M]
        run: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.1', cache: false }
      - name: machine
        run: lscpu | grep -E 'Model name|^CPU\(s\)' | cut -c1-200; uname -r; free -m
      - name: tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3 jq curl openssl linux-tools-common "linux-tools-$(uname -r)" \
            || sudo apt-get install -y -qq linux-tools-generic
      - name: seed
        run: bash seed/make-seed.sh && ls -la seed/feed.db
      - name: install
        run: |
          sudo bash submissions/swift-iouring-akbashev/install.sh > /tmp/install-swift.log 2>&1 || { tail -20 /tmp/install-swift.log; exit 1; }
          sudo bash submissions/rust-iouring-kensac/install.sh > /tmp/install-rust.log 2>&1 || { tail -20 /tmp/install-rust.log; exit 1; }
          sudo bash submissions/mojo-iouring-oh-meh/install.sh > /tmp/install-mojo.log 2>&1 || { tail -20 /tmp/install-mojo.log; exit 1; }
      - name: build
        run: |
          bash submissions/swift-iouring-akbashev-main/build.sh 2>&1 | tail -2
          bash submissions/rust-iouring-kensac/build.sh 2>&1 | tail -2
          bash submissions/mojo-iouring-oh-meh/build.sh 2>&1 | tail -2
          (cd profile/mload && go build -o mload .)
      - name: rate (40,000 users, short thinks), memory ${{ matrix.mem }}
        env: { LABEL: rate, USERS: '40000', TARGETS: '127.0.0.1,127.0.0.2', THINK: '0.15', RAMP: '20', HOLD: '80', WINDOW: '20', PERF: '15' }
        run: |
          [ "${{ matrix.mem }}" != none ] && export MEMMAX=${{ matrix.mem }}
          if [ "${{ matrix.run }}" = 1 ]; then
            bash profile/run.sh swift-iouring-akbashev-main mojo-iouring-oh-meh rust-iouring-kensac
          else
            bash profile/run.sh rust-iouring-kensac mojo-iouring-oh-meh swift-iouring-akbashev-main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'profile-mem-${{ matrix.mem }}-${{ matrix.run }}', path: profile/out, retention-days: 7 }

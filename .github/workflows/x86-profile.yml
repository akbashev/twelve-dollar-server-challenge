# Not for upstream: option A against B. swift-iouring-akbashev as in PR #371 (-next: SQLite with SQLITE_PRIVATE= and
# full LTO), with SQLite compiled inside a shim (internals static, 18 exported wrappers) without LTO (-shim) and with
# it (-shimlto), and rust-iouring-kensac, on x86 runners, each on one CPU in its own cgroup under the same mload load.
name: x86 profile
on:
  push:
    branches: [x86-profile-2]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        scenario: [rate, conns]
        run: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.1', cache: false }
      - name: machine
        run: lscpu | grep -E 'Model name|^CPU\(s\)|Thread|MHz|Flags' | cut -c1-300; uname -r; free -m
      - name: tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3 jq curl openssl linux-tools-common "linux-tools-$(uname -r)" \
            || sudo apt-get install -y -qq linux-tools-generic
      - name: seed
        run: bash seed/make-seed.sh
      - name: install
        run: |
          sudo bash submissions/swift-iouring-akbashev/install.sh > /tmp/install-swift.log 2>&1 || { tail -20 /tmp/install-swift.log; exit 1; }
          sudo bash submissions/rust-iouring-kensac/install.sh > /tmp/install-rust.log 2>&1 || { tail -20 /tmp/install-rust.log; exit 1; }
      - name: build
        run: |
          bash submissions/swift-iouring-akbashev-next/build.sh 2>&1 | tail -2
          bash submissions/swift-iouring-akbashev-shim/build.sh 2>&1 | tail -2
          bash submissions/swift-iouring-akbashev-shimlto/build.sh 2>&1 | tail -2
          bash submissions/rust-iouring-kensac/build.sh 2>&1 | tail -2
          (cd profile/mload && go build -o mload .)
      - name: rate (40,000 users, short thinks)
        if: matrix.scenario == 'rate'
        env: { LABEL: rate, USERS: '40000', TARGETS: '127.0.0.1,127.0.0.2', THINK: '0.15', RAMP: '20', HOLD: '80', WINDOW: '20', PERF: '15' }
        run: bash profile/run.sh swift-iouring-akbashev-next swift-iouring-akbashev-shim swift-iouring-akbashev-shimlto rust-iouring-kensac
      - name: connections (100,000 users)
        if: matrix.scenario == 'conns'
        env: { LABEL: conns, USERS: '100000', TARGETS: '127.0.0.1,127.0.0.2,127.0.0.3,127.0.0.4', THINK: '1', RAMP: '60', HOLD: '100', WINDOW: '20', PERF: '15' }
        run: bash profile/run.sh swift-iouring-akbashev-next swift-iouring-akbashev-shim swift-iouring-akbashev-shimlto rust-iouring-kensac
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'profile-${{ matrix.scenario }}-${{ matrix.run }}', path: profile/out, retention-days: 7 }

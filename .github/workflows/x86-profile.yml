# Not for upstream: near saturation, swift-iouring-akbashev as merged (#361), with only the write hold cut to 250 ms
# (-hold250), with only the checkpoint change (-ckpt), with all the next changes (-next), and rust-iouring-kensac, on
# x86 runners, each on one CPU in its own cgroup under the same mload load: latency, CPU per request, and the
# server's checkpoint log (holds, and how many ran out). One job per load level.
name: x86 profile
on:
  push:
    branches: [x86-profile-2]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        think: ['0.12', '0.10', '0.09']
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.1', cache: false }
      - name: machine
        run: lscpu | grep -E 'Model name|^CPU\(s\)|Thread|MHz|Flags' | cut -c1-300; uname -r; free -m
      - name: tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3 jq curl openssl linux-tools-common "linux-tools-$(uname -r)" \
            || sudo apt-get install -y -qq linux-tools-generic
      - name: seed
        run: bash seed/make-seed.sh
      - name: install
        run: |
          sudo bash submissions/swift-iouring-akbashev/install.sh > /tmp/install-swift.log 2>&1 || { tail -20 /tmp/install-swift.log; exit 1; }
          sudo bash submissions/rust-iouring-kensac/install.sh > /tmp/install-rust.log 2>&1 || { tail -20 /tmp/install-rust.log; exit 1; }
      - name: build
        run: |
          bash submissions/swift-iouring-akbashev/build.sh 2>&1 | tail -2
          bash submissions/swift-iouring-akbashev-hold250/build.sh 2>&1 | tail -2
          bash submissions/swift-iouring-akbashev-ckpt/build.sh 2>&1 | tail -2
          bash submissions/swift-iouring-akbashev-next/build.sh 2>&1 | tail -2
          bash submissions/rust-iouring-kensac/build.sh 2>&1 | tail -2
          (cd profile/mload && go build -o mload .)
      - name: near saturation (40,000 users, think scale ${{ matrix.think }})
        env: { LABEL: sat, USERS: '40000', TARGETS: '127.0.0.1,127.0.0.2', THINK: '${{ matrix.think }}', RAMP: '20', HOLD: '90', WINDOW: '20', PERF: '10' }
        run: >-
          bash profile/run.sh swift-iouring-akbashev swift-iouring-akbashev-hold250 swift-iouring-akbashev-ckpt
          swift-iouring-akbashev-next rust-iouring-kensac
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'profile-think-${{ matrix.think }}', path: profile/out, retention-days: 7 }

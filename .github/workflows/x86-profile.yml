# Not for upstream: main's code (-drop, #371 as merged at bd715b2), holds that grow once the WAL is past 64 MiB with the
# loop's own copy moved to 1 GiB (-wal), and the database synced before each hold (-sync: bulk copies until 128 frames
# are left, fdatasync, one more copy, checkpointer at nice 5, the file grown in 64 MiB chunks), in rotating order, near saturation with the server's disk capped (io.max) at three levels: p99, the
# checkpoint log lines, the WAL's largest size and the memory peak.
name: x86 profile
on:
  push:
    branches: [x86-profile-2]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        disk: [medium, tight]
        run: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.1', cache: false }
      - name: machine
        run: lscpu | grep -E 'Model name|^CPU\(s\)' | cut -c1-200; uname -r; free -m; findmnt -T /tmp; lsblk
      - name: tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3 jq curl openssl linux-tools-common "linux-tools-$(uname -r)" \
            || sudo apt-get install -y -qq linux-tools-generic
      - name: seed
        run: bash seed/make-seed.sh
      - name: install
        run: |
          sudo bash submissions/swift-iouring-akbashev/install.sh > /tmp/install-swift.log 2>&1 || { tail -20 /tmp/install-swift.log; exit 1; }
      - name: build
        run: |
          bash submissions/swift-iouring-akbashev-drop/build.sh 2>&1 | tail -2
          bash submissions/swift-iouring-akbashev-wal/build.sh 2>&1 | tail -2
          bash submissions/swift-iouring-akbashev-sync/build.sh 2>&1 | tail -2
          (cd profile/mload && go build -o mload .)
      - name: near saturation (60,000 users, short thinks), disk ${{ matrix.disk }}
        env: { LABEL: sat, USERS: '60000', TARGETS: '127.0.0.1,127.0.0.2', THINK: '0.15', RAMP: '20', HOLD: '100', WINDOW: '20', PERF: '15' }
        run: |
          case "${{ matrix.disk }}" in
            medium) export DISK="wbps=104857600 wiops=3000 rbps=104857600 riops=3000" ;;
            tight) export DISK="wbps=31457280 wiops=1000 rbps=52428800 riops=2000" ;;
          esac
          # The order rotates between the three runs.
          case "${{ matrix.run }}" in
            1) bash profile/run.sh swift-iouring-akbashev-drop swift-iouring-akbashev-wal swift-iouring-akbashev-sync ;;
            2) bash profile/run.sh swift-iouring-akbashev-wal swift-iouring-akbashev-sync swift-iouring-akbashev-drop ;;
            3) bash profile/run.sh swift-iouring-akbashev-sync swift-iouring-akbashev-drop swift-iouring-akbashev-wal ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'profile-disk-${{ matrix.disk }}-${{ matrix.run }}', path: profile/out, retention-days: 7 }
